<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ISTE Quiz Player Pad</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet"><style>body{font-family:Inter,sans-serif;background:#F5E1ED;color:#161340}h1,h2,h3,.font-heading{font-family:'Plus Jakarta Sans',sans-serif}</style>
<style id="synapse-dark-theme">
:root{color-scheme:dark;--syn-bg:#050507;--syn-surface:#0d0d13;--syn-surface-2:#12121b;--syn-border:#282536;--syn-blue:#4b83d1;--syn-purple:#7957bd;--syn-text:#eceaf3;--syn-muted:#a6a2b5}
html,body{background:#050507!important;color:var(--syn-text)!important}
body{font-family:Inter,sans-serif!important;background:#050507!important}
h1,h2,h3,.font-heading{font-family:'Plus Jakarta Sans',sans-serif}
/* Replace the original pastel surfaces with quiet charcoal panels. */
.bg-white,.bg-white\/80,.bg-white\/90,.bg-white\/70,.bg-white\/50{background:var(--syn-surface)!important;color:var(--syn-text)!important}
[class*="bg-[#F"],[class*="bg-[#f"],[class*="bg-[#E"],[class*="bg-[#e"]{background-color:var(--syn-surface)!important}
[class*="text-[#"],[class*="text-indigo-"],[class*="text-purple-"],[class*="text-pink-"]{color:var(--syn-text)!important}
[class*="border-[#"],[class*="border-pink-"],[class*="border-purple-"],[class*="border-indigo-"]{border-color:var(--syn-border)!important}
.rounded-3xl,.rounded-2xl,.rounded-xl{border-color:var(--syn-border)!important}
.shadow-xl,.shadow-lg,.shadow-md{box-shadow:0 12px 34px rgba(0,0,0,.28)!important}
button,[role="button"],a[class*="bg-"]{transition:background-color .18s ease,border-color .18s ease,transform .18s ease}
button:hover,[role="button"]:hover,a[class*="bg-"]:hover{filter:brightness(1.12)}
input,textarea,select{background:#09090f!important;color:var(--syn-text)!important;border:1px solid #343044!important}
input::placeholder,textarea::placeholder{color:#777386!important}
header{background:rgba(5,5,8,.96)!important;border-color:#242132!important;backdrop-filter:blur(12px)}
img[src*="synapse-logo"]{object-fit:contain;filter:none}
img[src="assets/synapse-logo.png"]{max-width:min(100%,360px);height:auto;max-height:130px}
#bootWarning{background:#211522!important;color:#e7d8ef!important;border:1px solid #684b75}
::selection{background:#55417c;color:#fff}
/* Keep accents limited to the logo's blue and purple. */
[class*="bg-indigo-"],[class*="bg-purple-"]{background-color:#29213b!important}
[class*="text-blue-"],[class*="text-cyan-"]{color:#83aee8!important}
[class*="ring-indigo-"],[class*="ring-purple-"]{--tw-ring-color:rgba(121,87,189,.45)!important}
</style>

<style>
:root{color-scheme:dark;--bg:#050507;--panel:#0d0c13;--line:#282238;--muted:#a7a1b9;--purple:#7952b8;--purple2:#9a70d5;--blue:#4779c7;--white:#f7f5fb}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--white);font-family:Inter,Arial,sans-serif}
body{background:radial-gradient(ellipse at 12% 0%,rgba(71,121,199,.12),transparent 32%),radial-gradient(ellipse at 92% 10%,rgba(121,82,184,.13),transparent 34%),#050507}
.round2-shell{width:min(920px,100%);margin:0 auto;padding:28px 22px 64px}.round2-header{display:flex;align-items:center;justify-content:space-between;padding:8px 0 24px;border-bottom:1px solid #292238;margin-bottom:34px}.wordmark{font-size:22px;letter-spacing:.13em;font-weight:900;color:#fff}.round-label{font-size:11px;letter-spacing:.18em;font-weight:800;color:#b8a7d8}.round-label span{color:#668acb;margin:0 6px}
.question-panel,.results-panel{background:linear-gradient(145deg,rgba(18,16,27,.96),rgba(8,8,12,.98));border:1px solid var(--line);border-radius:22px;padding:clamp(22px,4vw,42px);box-shadow:0 24px 80px rgba(0,0,0,.3)}.question-topline{display:flex;justify-content:space-between;gap:16px;color:#bba8df;font-size:11px;font-weight:800;letter-spacing:.13em}.progress-track{height:4px;background:#211b2d;border-radius:99px;margin:15px 0 28px;overflow:hidden}.progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--purple2));transition:width .25s ease}
.question-media{display:flex;justify-content:center;margin:0 auto 24px}.question-image{max-width:100%;max-height:320px;object-fit:contain;border-radius:14px;border:1px solid #30283e;background:#09090d}.question-text{font-size:clamp(22px,3vw,30px);line-height:1.3;margin:0 0 22px;font-weight:800;letter-spacing:-.025em}.select-hint{font-size:10px;letter-spacing:.15em;font-weight:800;color:#9287a9;margin:0 0 12px}.options-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.option-button{min-height:76px;display:flex;align-items:center;gap:14px;text-align:left;padding:16px;border:1px solid #302a3d;border-radius:14px;background:#111019;color:#e9e5f0;font-size:14px;font-weight:650;line-height:1.45;cursor:pointer;transition:border-color .18s,background .18s,transform .18s}.option-button:hover:not(:disabled){border-color:#7653a8;background:#191426;transform:translateY(-1px)}.option-letter{flex:0 0 32px;height:32px;display:grid;place-items:center;border-radius:9px;background:#21182f;border:1px solid #594078;color:#c4a6ee;font-size:12px;font-weight:900}.option-button.selected{border-color:#9a70d5;background:#21172e}.option-button.correct{border-color:#5c9c82;background:#10251f;color:#d7f4e7}.option-button.incorrect{border-color:#9b5d69;background:#28151d;color:#f5dce1}.option-button.chosen{border-color:#9a70d5;background:#21172e}.option-button:disabled{cursor:default}
.submission-notice{margin-top:18px;padding:14px 16px;border:1px solid #594078;border-radius:12px;background:#171124;color:#d9c5f4;font-size:13px;font-weight:750}.notice-correct{border-color:#315e4e;background:#102019;color:#bfe8d4}.notice-wrong{border-color:#75424d;background:#24151a;color:#f0c8d0}.hidden{display:none!important}.question-actions{display:flex;justify-content:flex-end;margin-top:24px}.primary-button{border:1px solid #7651aa;background:linear-gradient(135deg,#4c2d78,#67439b);color:#fff;padding:13px 22px;border-radius:12px;font-size:13px;font-weight:800;cursor:pointer;box-shadow:0 8px 24px rgba(84,53,127,.18);transition:filter .2s,transform .2s}.primary-button:hover:not(:disabled){filter:brightness(1.12);transform:translateY(-1px)}.primary-button:disabled{opacity:.4;cursor:not-allowed}.primary-button span{margin-left:12px}.results-panel{text-align:center;padding:60px 30px}.result-symbol{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;margin:0 auto 24px;background:#21172e;border:1px solid #7651aa;color:#c4a6ee;font-size:28px}.results-panel h1{font-size:clamp(30px,5vw,44px);margin:14px 0}.final-score{font-size:24px;font-weight:900;color:#c6a8f0;margin:18px 0}.save-status{font-size:13px;color:var(--muted);margin:0 0 28px}
@media(max-width:640px){.round2-shell{padding:18px 14px 40px}.round2-header{margin-bottom:22px}.options-grid{grid-template-columns:1fr}.option-button{min-height:64px}.question-panel{padding:22px 17px}.question-text{font-size:23px}}
</style>

</head><div id="bootWarning" style="display:none;position:fixed;z-index:9999;top:10px;left:50%;transform:translateX(-50%);background:#fee2e2;color:#991b1b;padding:10px 14px;border-radius:10px;font:700 12px Inter,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.15)">Connection script failed. Refresh this page.</div><script>window.addEventListener("error",function(e){if(e.message&&/supabase|createClient|undefined/i.test(e.message)){document.getElementById("bootWarning").style.display="block";}});</script><body class="min-h-screen antialiased">
<main class="round2-shell">

  </header>
  <section id="questionScreen" class="question-panel">

      <span id="qNumberTag">QUESTION 01 / 25</span>

    <p class="round-label">ROUND 02 COMPLETE</p>

    <p id="saveStatus" class="save-status">Your responses have been recorded.</p>
    <button class="primary-button" onclick="location.reload()">Try again <span>↻</span></button>
  </section>
</main>

const POINTS_PER_QUESTION = 100;
let questionIndex = 0;
let selectedOptionIndex = null;
let hasAnsweredCurrentQ = false;
let totalScore = 0;
let answeredCount = 0;
let saveErrors = 0;
const playerName = `R2-${Date.now()}-${Math.random().toString(36).slice(2,8)}`;
const letters = ['A','B','C','D'];

function escapeHtml(v){return String(v).replace(/[&<>\'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[c]));}

function renderQuestion(){
  const q = QUESTIONS[questionIndex];
  selectedOptionIndex = null;
  hasAnsweredCurrentQ = false;
  document.getElementById('qNumberTag').textContent = `QUESTION ${String(questionIndex+1).padStart(2,'0')} / ${String(QUESTIONS.length).padStart(2,'0')}`;
  document.getElementById('progressText').textContent = `${answeredCount} answered`;
  document.getElementById('progressBar').style.width = `${(questionIndex/QUESTIONS.length)*100}%`;
  document.getElementById('questionText').textContent = q.question;
  const media = document.getElementById('questionMedia');
  media.innerHTML = q.video
    ? `<video src="${q.video}" class="question-image" autoplay muted playsinline loop></video>`
    : (q.image ? `<img src="${q.image}" class="question-image" alt="Question visual" loading="lazy">` : '');
  document.getElementById('optionButtonsGrid').innerHTML = q.options.map((opt,i)=>
    `<button type="button" class="option-button" onclick="selectOption(${i})"><span class="option-letter">${letters[i]}</span><span>${escapeHtml(opt)}</span></button>`
  ).join('');
  document.getElementById('submissionNotice').classList.add('hidden');
  document.getElementById('submissionNotice').textContent = '';
  const next = document.getElementById('nextButton');
  next.disabled = true;
  next.innerHTML = questionIndex === QUESTIONS.length-1 ? 'Finish round <span>→</span>' : 'Next question <span>→</span>';
}

function selectOption(index){
  if(hasAnsweredCurrentQ) return;
  selectedOptionIndex = index;
  document.querySelectorAll('.option-button').forEach((button,i)=>button.classList.toggle('selected',i===index));
  submitAnswer(index);
}

async function submitAnswer(optionIndex){
  if(hasAnsweredCurrentQ) return;
  hasAnsweredCurrentQ = true;
  answeredCount++;
  const q = QUESTIONS[questionIndex];
  const isPoll = q.type === 'poll';
  const isCorrect = !isPoll && Number(optionIndex) === Number(q.correct);
  const points = isCorrect ? POINTS_PER_QUESTION : 0;
  totalScore += points;

  document.querySelectorAll('.option-button').forEach((button,i)=>{
    button.disabled = true;
    if(isPoll){ if(i===optionIndex) button.classList.add('chosen'); }
    else if(i===Number(q.correct)) button.classList.add('correct');
    else if(i===optionIndex) button.classList.add('incorrect');
  });

  const notice = document.getElementById('submissionNotice');
  notice.classList.remove('hidden');
  if(isPoll){
    notice.textContent = 'Vote recorded.';
  } else if(isCorrect){
    notice.textContent = `Correct answer · +${POINTS_PER_QUESTION} points`;
    notice.classList.add('notice-correct');
  } else {
    notice.textContent = `Not quite. Correct answer: ${letters[Number(q.correct)]}`;
    notice.classList.add('notice-wrong');
  }
  document.getElementById('progressText').textContent = `${answeredCount} answered`;
  document.getElementById('nextButton').disabled = false;

  try{
    const {error} = await db.from('responses').insert({
      player_name: playerName,
      question_id: q.id,
      selected_option: optionIndex,
      score: points
    });
    if(error) throw error;
  }catch(error){
    saveErrors++;
    console.error('Could not save Round 2 response:',error);
    document.getElementById('saveStatus').textContent = 'Some responses could not be synced. Your score is still shown here.';
  }
}

function nextQuestion(){
  if(!hasAnsweredCurrentQ) return;
  if(questionIndex < QUESTIONS.length-1){
    questionIndex++;
    renderQuestion();
    window.scrollTo({top:0,behavior:'smooth'});
    return;
  }
  document.getElementById('questionScreen').classList.add('hidden');
  document.getElementById('resultsScreen').classList.remove('hidden');
  document.getElementById('progressBar').style.width = '100%';
  document.getElementById('finalScore').textContent = `${totalScore} / ${QUESTIONS.filter(q=>q.type!=='poll').length*POINTS_PER_QUESTION} points`;
  document.getElementById('saveStatus').textContent = saveErrors ? 'Your score is shown above, but some answers could not be synced.' : 'Your responses have been recorded.';
}

renderQuestion();
</script>
</body>
</html>
